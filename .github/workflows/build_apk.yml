name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v3.1.0 - leave blank to auto-detect from build.gradle.kts)'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark this release as pre-release / beta'
        type: boolean
        default: false

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Determine Tag Name
        id: tag_name
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION:-3.1.0}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Rename Release APK
        run: |
          TAG="${{ steps.tag_name.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            cp "$APK_DIR/app-release.apk" "$APK_DIR/Pirith-$TAG.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pirith-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/Pirith-${{ steps.tag_name.outputs.tag }}.apk
            app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: "Pirith Release ${{ steps.tag_name.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
